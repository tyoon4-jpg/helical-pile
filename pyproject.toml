[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helical-pile-design"
version = "0.1.0"
description = "Calculation engine for helical pile foundations supporting lighting poles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
app = ["streamlit>=1.30", "plotly>=5.18", "python-docx>=1.1", "matplotlib>=3.8", "ezdxf>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
